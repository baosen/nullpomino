# NullpoMino browser (web build) netplay settings.
# Only the web build reads this file. The lounge (room list, chat,
# presence) and the WebRTC offer/answer signaling ride public MQTT
# brokers over secure WebSocket; game traffic itself flows over direct
# peer-to-peer WebRTC DataChannels using the STUN servers below for NAT
# traversal. This file is re-fetched on every page load, so edits here
# reach players on their next reload.

# MQTT-over-WSS broker URLs, space-separated. The client connects to ALL
# of them at once (bonded) and dedupes, so one broker being down is a
# non-event. Anyone on the same brokers + topic root shares one lounge.
netweb.mqtt.brokers=wss://broker.emqx.io:8084/mqtt wss://test.mosquitto.org:8081

# Topic root; the protocol major version is appended (npp/v7/...)
netweb.mqtt.topicRoot=npp

# MQTT keepalive in seconds (PINGREQ rides at half this)
netweb.mqtt.keepAlive=30

# Per-broker connect timeout in milliseconds (gates on CONNACK, not the socket)
netweb.mqtt.connectTimeout=5000

# STUN servers for WebRTC NAT traversal, space-separated. TURN relays can
# be added here later as turn: URLs. Two players who are both behind
# symmetric NATs cannot connect without TURN.
netweb.stun=stun:stun.l.google.com:19302 stun:stun.cloudflare.com:3478

# Cap on waiting for ICE candidate gathering before shipping the
# offer/answer anyway, in milliseconds (non-trickle signaling)
netweb.iceGatherTimeout=3000
