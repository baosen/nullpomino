# NullpoMino P2P room netplay settings
# NullpoMino P2Pルームネットプレイ設定

# TCP port this peer listens on for room links (0 = pick an ephemeral port)
# If the port is busy an ephemeral port is used automatically; LAN discovery
# carries the real port, but internet friends need the forwarded port.
# このピアがルームリンク用に待ち受けるTCPポート (0 = 空きポートを自動選択)
netroom.port=9202

# Broadcast a LAN discovery beacon (UDP port 9201) while a session is joinable? true=yes false=no
# セッションが参加可能な間、LAN探索ビーコン(UDPポート9201)を送信する? true=する false=しない
netroom.lanAnnounce=true
