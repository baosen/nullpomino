name: Deploy web build to GitHub Pages

on:
  push:
    # "+" is a special character in workflow filter patterns (one-or-more of
    # the preceding character), so it must be escaped to match the literal
    # branch name — unescaped, pushes never trigger this workflow.
    branches: ['nullpomino\+']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Enables Pages (source: GitHub Actions) on first run if needed.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Cache Bazel
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: bazel-web-${{ hashFiles('MODULE.bazel', 'maven_install.json', '.bazelversion') }}
          restore-keys: bazel-web-

      # Ubuntu runners ship bazelisk as `bazel`; .bazelversion pins the version.
      - name: Build site
        run: sh web/build-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
