<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NullpoMino+</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="classes.js"></script>
  <script>
    // TeaVM's UMD bundle attaches main() to the global scope; invoke it.
    (function () {
      var m = (typeof main === "function") ? main
        : (window.main || (window.$rt_exports && window.$rt_exports.main));
      if (m) { m([]); } else { console.error("NullpoMino: TeaVM main() not found"); }
    })();
  </script>
</body>
</html>
