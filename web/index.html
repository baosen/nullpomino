<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NullpoMino+</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; }

    /* Loading overlay — painted before classes.js even downloads. Dark, self
       contained (no external fonts/images), dismissed on the first game frame. */
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #000; color: #e6e6e6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      opacity: 1; transition: opacity 320ms ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-title { font-size: 28px; font-weight: 700; letter-spacing: 0.06em; color: #fff; }
    #loading-track {
      position: relative; overflow: hidden;
      width: min(70vw, 320px); height: 8px;
      border-radius: 999px; background: rgba(255,255,255,0.12);
    }
    #loading-bar {
      position: absolute; left: 0; top: 0; height: 100%; width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f8cff, #7fd7ff);
      transition: width 180ms ease;
    }
    /* Indeterminate fallback: a sliding sheen when the width isn't being driven. */
    #loading-track.indeterminate #loading-bar { width: 40%; animation: npp-slide 1.1s ease-in-out infinite; }
    @keyframes npp-slide { 0% { left: -40%; } 100% { left: 100%; } }
    #loading-label { font-size: 13px; color: #9aa0a6; min-height: 1em; }
    #loading.error #loading-bar { background: #ff5f56; }
    #loading.error #loading-label { color: #ff9a94; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">
    <div id="loading-title">NullpoMino+</div>
    <div id="loading-track"><div id="loading-bar"></div></div>
    <div id="loading-label">Loading&hellip;</div>
  </div>
  <script>
    (function () {
      var overlay = document.getElementById("loading");
      var track = document.getElementById("loading-track");
      var bar = document.getElementById("loading-bar");
      var label = document.getElementById("loading-label");

      // The download loop below owns 0–30%; the TeaVM game (via WebProgress)
      // drives 30–100% and then calls __nppDone once the first frame renders.
      window.__nppProgress = function (frac, text) {
        track.classList.remove("indeterminate");
        var pct = Math.max(0, Math.min(1, frac)) * 100;
        bar.style.width = pct.toFixed(1) + "%";
        if (text) label.textContent = text;
      };
      window.__nppDone = function () {
        window.__nppProgress(1, "");
        overlay.classList.add("hidden");
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 360);
      };
      window.__nppError = function (msg) {
        track.classList.remove("indeterminate");
        overlay.classList.add("error");
        label.textContent = msg || "Failed to load";
      };

      // TeaVM's UMD bundle attaches main() to the global scope; invoke it.
      function callMain() {
        var m = (typeof main === "function") ? main
          : (window.main || (window.$rt_exports && window.$rt_exports.main));
        if (m) { m([]); }
        else { console.error("NullpoMino: TeaVM main() not found"); window.__nppError("Failed to start — see console"); }
      }

      // Fallback path: a plain <script src>; the bar shimmers indeterminately
      // through the (unmeasured) download, then Java takes over the 30–100% band.
      function loadViaScriptTag() {
        track.classList.add("indeterminate");
        label.textContent = "Downloading…";
        var s = document.createElement("script");
        s.src = "classes.js";
        s.onload = callMain;
        s.onerror = function () { window.__nppError("Failed to download — see console"); };
        document.body.appendChild(s);
      }

      // Preferred path: stream classes.js so the download shows real progress
      // in the 0–30% band, then inject it as a classic script.
      function loadViaFetch() {
        label.textContent = "Downloading…";
        fetch("classes.js").then(function (resp) {
          if (!resp.ok || !resp.body || !resp.body.getReader) { loadViaScriptTag(); return; }
          var totalHeader = resp.headers.get("Content-Length");
          var total = totalHeader ? parseInt(totalHeader, 10) : 0;
          var received = 0, chunks = [];
          var reader = resp.body.getReader();
          function pump() {
            return reader.read().then(function (res) {
              if (res.done) {
                window.__nppProgress(0.3, "Starting…");
                var url = URL.createObjectURL(new Blob(chunks, { type: "text/javascript" }));
                var s = document.createElement("script");
                s.src = url;
                s.onload = function () { URL.revokeObjectURL(url); callMain(); };
                s.onerror = function () { URL.revokeObjectURL(url); loadViaScriptTag(); };
                document.body.appendChild(s);
                return;
              }
              chunks.push(res.value);
              received += res.value.length;
              if (total > 0) {
                // Clamp below the band's end until the stream truly finishes;
                // gzip makes the decompressed bytes exceed Content-Length.
                window.__nppProgress(Math.min(received / total * 0.3, 0.29), "Downloading…");
              } else {
                track.classList.add("indeterminate");
              }
              return pump();
            });
          }
          return pump();
        }).catch(function () { loadViaScriptTag(); });
      }

      if (window.fetch && window.ReadableStream) { loadViaFetch(); }
      else { loadViaScriptTag(); }
    })();
  </script>
</body>
</html>
